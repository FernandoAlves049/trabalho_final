name: trabalho_final
description: Pixel Radar, catálogo de promoções de jogos para PC.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.6.0
  sqflite: ^2.4.2
  path: ^1.9.1
  url_launcher: ^6.3.2
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/arcade.png
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/BarlowCondensed-Bold.ttf
          weight: 700
